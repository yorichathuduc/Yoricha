<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<meta name="theme-color" content="#3971b8"/>
<title>Yoricha</title>
<link href="https://fonts.googleapis.com/css2?family=Merienda:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3971b8;--green-dark:#343b1b;--cream:#fbfcee;--gold:#f6e6a5;--gold-dark:#d4a017}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--blue);-webkit-tap-highlight-color:transparent}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem}
/* LOGO */
.logo-wrap{margin-bottom:2rem;text-align:center}
.logo-wrap img{max-width:200px;width:60%;display:block;margin:0 auto;border-radius:16px;padding:12px 16px;background:rgba(255,255,255,0.15)}
.tagline{font-family:'Merienda',cursive;color:rgba(255,255,255,0.7);font-size:.78rem;letter-spacing:2px;text-transform:uppercase;margin-top:.6rem}
/* BUTTONS */
.btn-group{width:100%;max-width:340px;display:flex;flex-direction:column;gap:.85rem}
.main-btn{display:flex;align-items:center;gap:1rem;background:#fff;border:none;border-radius:18px;padding:1.1rem 1.25rem;cursor:pointer;text-decoration:none;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.main-btn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.btn-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.btn-text{text-align:left;flex:1}
.btn-title{font-family:'Merienda',cursive;font-size:1rem;color:var(--green-dark);display:block;line-height:1.3}
.btn-sub{font-size:.72rem;color:#888;margin-top:.15rem;display:block;line-height:1.4}
.btn-arrow{color:#ccc;font-size:1.1rem;flex-shrink:0}
/* STAFF button — subtle different style */
.staff-btn{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.25)}
.staff-btn .btn-title{color:#fff}
.staff-btn .btn-sub{color:rgba(255,255,255,0.6)}
.staff-btn .btn-arrow{color:rgba(255,255,255,0.4)}
/* FOOTER */
.footer{margin-top:2.5rem;text-align:center;font-size:.7rem;color:rgba(255,255,255,0.4);line-height:1.8}
</style>
</head>
<body>
<div class="screen">

  <div class="logo-wrap">
    <img src="https://drive.google.com/thumbnail?id=1uQD0joy3YQ1PlHSGNZJoy_dFC_oT-miJ&sz=w300" alt="Yoricha"/>
    <div class="tagline">Matcha núp hẻm · Thủ Đức</div>
  </div>

  <div class="btn-group">

    <a class="main-btn" href="yoricha-order.html">
      <div class="btn-icon" style="background:#e8f4fd">🍵</div>
      <div class="btn-text">
        <span class="btn-title">Xem menu & order ở đây</span>
        <span class="btn-sub">Cần tư vấn món thì hỏi nhân viên nha 🤗</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>

    <a class="main-btn" href="yoricha-membership.html">
      <div class="btn-icon" style="background:#e8f7ed">🌿</div>
      <div class="btn-text">
        <span class="btn-title">Hội Yoricha Bétti</span>
        <span class="btn-sub">Nhận ưu đãi - uống matcha thoải mái 🎁</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>

  </div>

  <div class="footer">
    24/10 Đường số 6, khu phố 13, Thủ Đức, TP.HCM<br/>
    Mở cửa: 6:30 – 21:00
  </div>

</div>
</body>
</html>
