<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<meta name="theme-color" content="#3971b8"/>
<title>Yoricha — Order</title>
<link href="https://fonts.googleapis.com/css2?family=Merienda:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3971b8;--blue-light:#e8f0fb;--blue-mid:#b5d0f0;--green-dark:#343b1b;--cream:#fbfcee;--gold:#f6e6a5;--gold-dark:#d4a017;--red:#e74c3c;--r:16px}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--cream);color:var(--green-dark);-webkit-tap-highlight-color:transparent}
/* HEADER */
.header{background:var(--blue);padding:1rem 1rem 2.5rem;text-align:center;position:relative}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:40px;background:var(--cream);clip-path:ellipse(55% 100% at 50% 100%)}
.header img{height:56px;object-fit:contain}
.header-sub{font-family:'Merienda',cursive;font-size:.75rem;color:#b5d0f0;letter-spacing:2px;text-transform:uppercase;margin-top:.3rem}
.nav-pill{position:absolute;top:.75rem;right:.75rem;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:.35rem .85rem;font-size:.75rem;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;-webkit-tap-highlight-color:transparent}
/* WRAP */
.wrap{max-width:480px;margin:0 auto;padding:.75rem .9rem}
/* CARD */
.card{background:#fff;border:1.5px solid var(--blue-mid);border-radius:var(--r);padding:1.1rem;margin-bottom:.75rem;box-shadow:0 2px 12px rgba(57,113,184,.07)}
.card-title{font-family:'Merienda',cursive;color:var(--blue);font-size:.95rem;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem}
/* FORM */
label{display:block;font-size:.75rem;font-weight:700;color:var(--green-dark);margin-bottom:.25rem;letter-spacing:.3px}
input[type=tel],input[type=text],textarea,select{width:100%;border:1.5px solid var(--blue-mid);border-radius:10px;padding:.65rem .9rem;font-family:'Nunito',sans-serif;font-size:.95rem;color:var(--green-dark);background:#fafeff;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s;margin-bottom:.75rem}
input:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff}
textarea{resize:none;height:64px}
/* BUTTONS */
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-family:'Merienda',cursive;font-size:1rem;border:none;border-radius:12px;padding:.8rem;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(.9)}
.btn:disabled{background:#aaa}
.btn-outline{background:transparent;border:2px solid var(--blue);color:var(--blue)}
.btn-sm{display:inline-block;width:auto;padding:.45rem 1rem;font-size:.82rem;border-radius:10px;border:none;cursor:pointer;font-family:'Merienda',cursive;background:var(--blue);color:#fff}
.btn-sm.outline{background:transparent;border:1.5px solid var(--blue);color:var(--blue)}
/* MEMBER BADGE */
.member-badge{background:var(--blue-light);border:1.5px solid var(--blue-mid);border-radius:12px;padding:.75rem;display:flex;align-items:center;gap:.65rem;margin-bottom:.75rem}
.mbadge-av{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Merienda',cursive;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mbadge-name{font-weight:700;color:var(--blue);font-size:.9rem}
.mbadge-stamps{font-size:.75rem;color:#666;margin-top:.15rem}
.sdots{display:flex;gap:3px;margin-top:.3rem}
.sdot{width:9px;height:9px;border-radius:50%;background:#dde;border:1px solid #bbc}
.sdot.on{background:var(--blue);border-color:var(--blue)}
.sdot.ms.on{background:var(--gold-dark);border-color:var(--gold-dark)}
/* TABS */
.cat-tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.75rem;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.ctab{background:#fff;border:1.5px solid var(--blue-mid);border-radius:20px;padding:.35rem .9rem;font-size:.8rem;font-weight:700;color:var(--blue);white-space:nowrap;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ctab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
/* MENU GRID */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mitem{background:#fff;border:1.5px solid var(--blue-mid);border-radius:14px;padding:.85rem .75rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,box-shadow .15s}
.mitem:active{border-color:var(--blue);box-shadow:0 3px 12px rgba(57,113,184,.15)}
.mitem.na{opacity:.5;pointer-events:none}
.mi-name{font-weight:700;font-size:.85rem;color:var(--green-dark);line-height:1.3;margin-bottom:.3rem}
.mi-price{font-size:.78rem;color:var(--blue);font-weight:700}
.mi-desc{font-size:.68rem;color:#888;margin-top:.2rem;line-height:1.4}
.szb{display:inline-block;font-size:.62rem;background:var(--blue-light);color:var(--blue);border-radius:5px;padding:.1rem .35rem;margin-right:.2rem;font-weight:700}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.25rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom));width:100%;max-width:480px;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-family:'Merienda',cursive;color:var(--blue);font-size:1rem;margin-bottom:.85rem}
.sz-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.85rem}
.sz-opt{border:2px solid var(--blue-mid);border-radius:12px;padding:.75rem;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sz-opt.on,.sz-opt:active{border-color:var(--blue);background:var(--blue-light)}
.sz-lbl{font-weight:700;color:var(--blue);font-size:.9rem}
.sz-price{font-size:.78rem;color:#666;margin-top:.15rem}
.sw-row{display:flex;align-items:center;gap:.65rem;margin-bottom:.85rem}
.sw-row label{margin:0;white-space:nowrap;font-size:.78rem;min-width:65px}
.sw-row select{margin:0;flex:1}
.qty-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.qty-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.qty-n{font-size:1.1rem;font-weight:700;min-width:28px;text-align:center}
/* CART BAR */
.cart-bar{position:fixed;bottom:0;left:0;right:0;padding:.75rem .9rem calc(.75rem + env(safe-area-inset-bottom));z-index:100;display:flex;justify-content:center}
.cbtn{background:var(--blue);color:#fff;border:none;border-radius:14px;padding:.85rem 1.25rem;font-family:'Merienda',cursive;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;max-width:480px;box-shadow:0 4px 20px rgba(57,113,184,.35)}
.cbtn-badge{background:#fff;color:var(--blue);border-radius:20px;padding:.1rem .65rem;font-size:.82rem;font-weight:700}
/* CART ITEMS */
.ci{display:flex;align-items:flex-start;gap:.65rem;padding:.65rem 0;border-bottom:1px dashed var(--blue-mid)}
.ci:last-child{border-bottom:none}
.ci-rm{background:none;border:none;color:#ccc;cursor:pointer;font-size:1.1rem;padding:.1rem;line-height:1;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ci-name{font-weight:700;font-size:.85rem;color:var(--green-dark);flex:1;min-width:0}
.ci-sub{font-size:.72rem;color:#888;margin-top:.1rem}
.ci-price{font-weight:700;color:var(--blue);font-size:.85rem;white-space:nowrap}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 0 .5rem;font-weight:700;font-size:.95rem;border-top:2px solid var(--blue-mid)}
.disc-box{background:var(--gold);border-radius:10px;padding:.6rem .85rem;font-size:.8rem;font-weight:700;text-align:center;margin-bottom:.6rem}
/* STATUS */
.stcard{text-align:center;padding:2rem .75rem}
.st-icon{font-size:3.5rem;margin-bottom:.65rem}
.st-id{font-family:'Merienda',cursive;color:var(--blue);font-size:1.2rem;margin-bottom:.4rem}
.st-pill{display:inline-block;padding:.35rem 1.1rem;border-radius:20px;font-weight:700;font-size:.85rem;margin-bottom:1rem}
.st-pill.new{background:#fff3cd;color:#856404}
.st-pill.making{background:#cfe2ff;color:#084298}
.st-pill.done{background:#d1e7dd;color:#0a3622}
.st-stamp{display:none;background:var(--gold);border-radius:10px;padding:.65rem;font-size:.82rem;font-weight:700;margin-bottom:1rem}
/* ALERT */
.alert{border-radius:10px;padding:.6rem .85rem;font-size:.82rem;font-weight:600;margin-bottom:.75rem;display:none}
.alert.ok{background:#e6f7ed;color:#1a7f3c;border:1px solid #a3d9b1}
.alert.err{background:#fdecea;color:#b91c1c;border:1px solid #fca5a5}
/* PAGES */
.page{display:none}.page.on{display:block}
footer{text-align:center;padding:1rem .75rem 5rem;font-size:.72rem;color:#aaa}
footer strong{color:var(--blue)}
</style>
</head>
<body>

<div class="header">
  <a class="nav-pill" href="yoricha-membership.html">🌿 Thẻ thành viên</a>
  <img id="logo-img" src="" alt="Yoricha"/>
  <div class="header-sub">Order Online · Thủ Đức</div>
</div>

<div class="wrap">

<!-- PAGE PHONE -->
<div class="page on" id="pg-phone">
  <div class="card" style="margin-top:.5rem">
    <div class="card-title">👋 Bạn là thành viên?</div>
    <div id="ph-alert" class="alert"></div>
    <label>Nhập SĐT để nhận điểm (không bắt buộc)</label>
    <input type="tel" id="inp-phone" placeholder="0901 234 567" inputmode="tel"/>
    <div id="member-preview"></div>
    <button class="btn" onclick="goMenu()">Xem menu & đặt hàng →</button>
  </div>
</div>

<!-- PAGE MENU -->
<div class="page" id="pg-menu">
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="mgrid" id="mgrid"></div>
  <div style="height:80px"></div>
</div>

<!-- PAGE CART -->
<div class="page" id="pg-cart">
  <button class="btn-sm outline" onclick="show('pg-menu')" style="margin-bottom:.75rem">← Thêm món</button>
  <div class="card">
    <div class="card-title">🛒 Giỏ hàng</div>
    <div id="cart-list"></div>
    <div class="total-row"><span>Tổng cộng</span><span id="cart-total">0đ</span></div>
  </div>
  <div id="disc-notice"></div>
  <div class="card">
    <div class="card-title">📝 Thông tin</div>
    <label>Tên của bạn</label>
    <input type="text" id="inp-name" placeholder="Nguyễn Văn A"/>
    <label>Ghi chú (ít đá, không đường...)</label>
    <textarea id="inp-note" placeholder="Ghi chú thêm cho tiệm..."></textarea>
    <div id="order-alert" class="alert"></div>
    <button class="btn" id="btn-order" onclick="placeOrder()">Đặt hàng 🍵</button>
  </div>
</div>

<!-- PAGE STATUS -->
<div class="page" id="pg-status">
  <div class="card stcard">
    <div class="st-icon" id="st-icon">⏳</div>
    <div class="st-id" id="st-id"></div>
    <div class="st-pill new" id="st-pill">Đang chờ xác nhận</div>
    <div id="st-items" style="font-size:.82rem;color:#555;line-height:1.7;margin-bottom:.75rem"></div>
    <div id="st-total" style="font-weight:700;color:var(--blue);margin-bottom:1rem"></div>
    <div class="st-stamp" id="st-stamp">🌿 Đã cộng điểm thành viên!</div>
    <button class="btn btn-outline" onclick="resetAll()">Đặt thêm</button>
  </div>
</div>

</div><!-- wrap -->

<!-- MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="mod-title"></div>
    <div class="sz-grid" id="sz-grid"></div>
    <div class="sw-row">
      <label>Độ ngọt</label>
      <select id="sel-sweet">
        <option value="0%">0%</option>
        <option value="30%">30%</option>
        <option value="50%" selected>50% (mặc định)</option>
        <option value="70%">70%</option>
        <option value="100%">100%</option>
      </select>
    </div>
    <div class="qty-row">
      <button class="qty-btn" onclick="dQty(-1)">−</button>
      <span class="qty-n" id="qty-n">1</span>
      <button class="qty-btn" onclick="dQty(1)">+</button>
      <span style="font-size:.82rem;color:#888;flex:1;margin-left:.4rem">ly</span>
    </div>
    <button class="btn" onclick="addCart()">Thêm vào giỏ →</button>
  </div>
</div>

<!-- CART BAR -->
<div class="cart-bar" id="cart-bar" style="display:none">
  <button class="cbtn" onclick="show('pg-cart');renderCart()">
    <span>🛒 Xem giỏ hàng <span class="cbtn-badge" id="cart-badge">0</span></span>
    <span id="cart-bar-total" style="font-size:.85rem;opacity:.9">0đ</span>
  </button>
</div>

<footer><strong>Yoricha</strong> · 24/10 Đường số 6, khu phố 13, Thủ Đức, TP.HCM · 6:30–21:00</footer>

<script>
// ── CONFIG ──────────────────────────────────────────────────
var API = 'https://script.google.com/macros/s/AKfycbxs-jt4COAvW__D7UFp1gmeiCbPJE7zNCqn7pEGOKUKDYmbcht1Wm765sxZcWH9gF4A/exec';
// Bước 1: Upload logo lên Google Drive → Share public → lấy File ID
// Bước 2: Thay FILE_ID bên dưới
var LOGO_URL = 'https://drive.google.com/thumbnail?id=FILE_ID&sz=w300';
document.getElementById('logo-img').src = LOGO_URL;

var PRODUCTS=['Matcha Latte','Matcha Coldwhisk','Matcha Mây Nước Dừa','Matcha Trong Nước Dừa','Matcha Latte Mứt Dâu','Matcha Latte Mứt Yuzu','Sữa Hạt Điều','Sữa Đậu Nành','Trà Yuzu','Trà Dâu'];
var menu=[], cart=[], member=null, curItem=null, curSize=null, curQty=1, pollT=null;

function fmt(n){return Number(n).toLocaleString('vi-VN')+'đ';}
async function api(p){return(await fetch(API+'?'+new URLSearchParams(p).toString())).json();}

function alert2(id,msg,type){var e=document.getElementById(id);e.textContent=msg;e.className='alert '+type;e.style.display='block';setTimeout(function(){e.style.display='none';},5000);}

function show(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on');});
  document.getElementById(id).classList.add('on');
  var cb=document.getElementById('cart-bar');
  cb.style.display=(id==='pg-menu'&&cart.length>0)?'flex':'none';
  window.scrollTo(0,0);
}

// ── PHONE ───────────────────────────────────────────────────
async function goMenu(){
  var ph=document.getElementById('inp-phone').value.trim();
  if(ph){var d=await api({action:'lookup',phone:ph});if(d.ok){member=d.member;renderBadge();}}
  else{member=null;}
  await loadMenu();show('pg-menu');
}
function renderBadge(){
  var el=document.getElementById('member-preview');
  if(!member){el.innerHTML='';return;}
  var dots='';for(var i=1;i<=10;i++){var c='sdot'+(i===4||i===7||i===10?' ms':'')+(i<=member.stamps?' on':'');dots+='<div class="'+c+'"></div>';}
  el.innerHTML='<div class="member-badge"><div class="mbadge-av">'+member.name.charAt(0).toUpperCase()+'</div><div><div class="mbadge-name">Chào, '+member.name+'! 👋</div><div class="mbadge-stamps">'+member.stamps+'/10 dấu mốc</div><div class="sdots">'+dots+'</div></div></div>';
}

// ── MENU ────────────────────────────────────────────────────
async function loadMenu(){
  var d=await api({action:'getMenu'});
  if(!d.ok)return;
  menu=d.menu;
  var cats=[];menu.forEach(function(it){if(cats.indexOf(it.category)<0)cats.push(it.category);});
  var tabs=document.getElementById('cat-tabs');
  tabs.innerHTML=cats.map(function(c,i){return'<div class="ctab'+(i===0?' on':'')+'" onclick="filt(this,\''+c+'\')">'+c+'</div>';}).join('');
  renderMenu(cats[0]);
}
function filt(el,cat){document.querySelectorAll('.ctab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');renderMenu(cat);}
function renderMenu(cat){
  var items=menu.filter(function(it){return it.category===cat;});
  document.getElementById('mgrid').innerHTML=items.map(function(it){
    var ps='';if(it.price_s)ps+='<span class="szb">S</span>'+fmt(it.price_s*1000)+' ';if(it.price_l)ps+='<span class="szb">L</span>'+fmt(it.price_l*1000);
    return'<div class="mitem'+(it.available?'':' na')+'" onclick="openMod(\''+it.id+'\')"><div class="mi-name">'+it.name+(it.available?'':' <span style="font-size:.65rem;color:var(--red)">(Hết)</span>')+'</div><div class="mi-price">'+ps+'</div><div class="mi-desc">'+(it.description||'')+'</div></div>';
  }).join('');
}

// ── MODAL ────────────────────────────────────────────────────
function openMod(id){
  var it=menu.find(function(x){return x.id===id;});
  if(!it||!it.available)return;
  curItem=it;curSize=it.price_s?'S':'L';curQty=1;
  document.getElementById('mod-title').textContent=it.name;
  var sz='';
  if(it.price_s)sz+='<div class="sz-opt'+(curSize==='S'?' on':'')+'" onclick="selSz(this,\'S\')"><div class="sz-lbl">Size S · 350ml</div><div class="sz-price">'+fmt(it.price_s*1000)+'</div></div>';
  if(it.price_l)sz+='<div class="sz-opt'+(curSize==='L'&&!it.price_s?' on':'')+'" onclick="selSz(this,\'L\')"><div class="sz-lbl">Size L · 700ml</div><div class="sz-price">'+fmt(it.price_l*1000)+'</div></div>';
  document.getElementById('sz-grid').innerHTML=sz;
  document.getElementById('qty-n').textContent=1;
  document.getElementById('modal').style.display='flex';
}
function selSz(el,sz){document.querySelectorAll('.sz-opt').forEach(function(o){o.classList.remove('on');});el.classList.add('on');curSize=sz;}
function dQty(d){curQty=Math.max(1,curQty+d);document.getElementById('qty-n').textContent=curQty;}
function closeModal(e){document.getElementById('modal').style.display='none';}
function addCart(){
  var pr=(curSize==='S'?curItem.price_s:curItem.price_l)*1000;
  var sw=document.getElementById('sel-sweet').value;
  cart.push({id:curItem.id,name:curItem.name,size:curSize,price:pr,qty:curQty,sweet:sw});
  document.getElementById('modal').style.display='none';
  updBar();
}

// ── CART ────────────────────────────────────────────────────
function updBar(){
  var cnt=cart.reduce(function(s,i){return s+i.qty;},0);
  var tot=cart.reduce(function(s,i){return s+i.price*i.qty;},0);
  document.getElementById('cart-badge').textContent=cnt;
  document.getElementById('cart-bar-total').textContent=fmt(tot);
  document.getElementById('cart-bar').style.display=cnt>0&&document.getElementById('pg-menu').classList.contains('on')?'flex':'none';
}
function rmCart(i){cart.splice(i,1);updBar();renderCart();if(!cart.length)show('pg-menu');}
function renderCart(){
  var tot=cart.reduce(function(s,i){return s+i.price*i.qty;},0);
  document.getElementById('cart-list').innerHTML=cart.map(function(it,i){
    return'<div class="ci"><button class="ci-rm" onclick="rmCart('+i+')">✕</button><div class="ci-name">'+it.name+'<div class="ci-sub">Size '+it.size+' · '+it.sweet+' · x'+it.qty+'</div></div><div class="ci-price">'+fmt(it.price*it.qty)+'</div></div>';
  }).join('');
  document.getElementById('cart-total').textContent=fmt(tot);
  var disc='';
  if(member){
    var s=member.stamps;
    if(s===4)disc='<div class="disc-box">🎁 Ly thứ 4 — mua 2 ly, ly thứ 2 FREE UPSIZE!</div>';
    if(s===7)disc='<div class="disc-box" style="background:#d1e7dd;color:#0a3622">💚 Ly thứ 7 — GIẢM 20%! '+fmt(tot)+' → '+fmt(tot*.8)+'</div>';
    if(s===10)disc='<div class="disc-box" style="background:#fff3cd;color:#856404">⭐ Ly thứ 10 — FREE 1 LY NƯỚC!</div>';
  }
  document.getElementById('disc-notice').innerHTML=disc;
  if(member&&!document.getElementById('inp-name').value)document.getElementById('inp-name').value=member.name;
}

// ── ORDER ────────────────────────────────────────────────────
async function placeOrder(){
  if(!cart.length){alert2('order-alert','Giỏ hàng trống!','err');return;}
  var name=document.getElementById('inp-name').value.trim();
  if(!name){alert2('order-alert','Vui lòng nhập tên.','err');return;}
  var btn=document.getElementById('btn-order');btn.disabled=true;btn.textContent='⏳ Đang gửi...';
  try{
    var d=await api({action:'placeOrder',phone:member?member.phone:(document.getElementById('inp-phone').value.trim()||''),name:name,note:document.getElementById('inp-note').value.trim(),items:JSON.stringify(cart)});
    if(!d.ok){alert2('order-alert',d.error,'err');return;}
    showStatus(d.orderID,'Mới');
    cart=[];updBar();
  }catch(e){alert2('order-alert','Lỗi kết nối, thử lại!','err');}
  finally{btn.disabled=false;btn.textContent='Đặt hàng 🍵';}
}

// ── STATUS ────────────────────────────────────────────────────
function showStatus(oid,status){
  var icons={'Mới':'⏳','Đang làm':'🍵','Xong':'✅'};
  var labels={'Mới':'Đang chờ xác nhận','Đang làm':'Đang pha chế...','Xong':'Sẵn sàng rồi!'};
  var cls={'Mới':'new','Đang làm':'making','Xong':'done'};
  document.getElementById('st-icon').textContent=icons[status]||'⏳';
  document.getElementById('st-id').textContent='Đơn #'+oid;
  var pill=document.getElementById('st-pill');pill.textContent=labels[status]||status;pill.className='st-pill '+(cls[status]||'new');
  if(status==='Xong'&&member){document.getElementById('st-stamp').style.display='block';}
  show('pg-status');
  if(pollT)clearInterval(pollT);
  if(status!=='Xong')pollT=setInterval(function(){pollStatus(oid);},10000);
}
async function pollStatus(oid){
  try{var d=await api({action:'getOrderStatus',orderID:oid});if(d.ok)showStatus(oid,d.status);}catch(e){}
}
function resetAll(){if(pollT)clearInterval(pollT);member=null;document.getElementById('inp-phone').value='';document.getElementById('inp-name').value='';document.getElementById('inp-note').value='';document.getElementById('member-preview').innerHTML='';document.getElementById('st-stamp').style.display='none';show('pg-phone');}
</script>
